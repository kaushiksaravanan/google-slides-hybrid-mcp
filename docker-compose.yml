# ─────────────────────────────────────────────────────────────────────────────
# Google Slides Hybrid MCP Server — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Profiles:
#   Production:  docker compose up google-slides-mcp
#   Development: docker compose --profile dev up google-slides-mcp-dev
#   Full stack:  docker compose --profile monitoring up
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  mcp-data:
    driver: local

networks:
  mcp-network:
    driver: bridge
  mcp-internal:
    driver: bridge
    internal: true

services:
  # ── Production ──────────────────────────────────────────────────────────────
  google-slides-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
    image: google-slides-hybrid-mcp:${VERSION:-latest}
    container_name: google-slides-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - BROWSER_WS_PORT=${BROWSER_WS_PORT:-9222}
      - VISION_ENABLED=${VISION_ENABLED:-true}
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      - mcp-data:/app/data
    networks:
      - mcp-network
      - mcp-internal
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "mcp-prod"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

  # ── Development (hot reload) ────────────────────────────────────────────────
  google-slides-mcp-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: google-slides-mcp-dev
    profiles:
      - dev
    restart: "no"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - BROWSER_WS_PORT=${BROWSER_WS_PORT:-9222}
      - VISION_ENABLED=${VISION_ENABLED:-true}
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./package.json:/app/package.json:ro
      - mcp-data:/app/data
    networks:
      - mcp-network
      - mcp-internal
    command: ["npx", "tsx", "--watch", "src/index.ts"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
        tag: "mcp-dev"

  # ── Test Runner ─────────────────────────────────────────────────────────────
  google-slides-mcp-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: google-slides-mcp-test
    profiles:
      - test
    restart: "no"
    env_file:
      - .env
    environment:
      - NODE_ENV=test
      - LOG_LEVEL=warn
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro
    networks:
      - mcp-internal
    command: ["npx", "vitest", "run", "--reporter=verbose"]
